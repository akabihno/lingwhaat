# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Manuscript character-grouping feature flag. Off ('0') = legacy per-character pattern search;
    # on ('1'/'true') = collapse configured multi-char sequences to single glyphs first. Default
    # here keeps existing deployments on the old behaviour until the env var is set.
    env(MANUSCRIPT_CHARACTER_GROUPING_ENABLED): '0'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Auto-tag all language repositories
    _instanceof:
        App\Repository\AbstractLanguageRepository:
            tags: ['app.language_repository']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\Search\ManuscriptCorpusSearchService:
      arguments:
        $characterGroupingEnabled: '%env(bool:MANUSCRIPT_CHARACTER_GROUPING_ENABLED)%'

    App\EventSubscriber\WordIndexSubscriber:
      tags:
        - { name: doctrine.event_subscriber }

    Elastica\Client:
      factory: [ 'App\Service\Search\ElasticsearchClientFactory', 'create' ]
      arguments:
        $esHost: 'http://%env(ELASTICSEARCH_HOST)%:%env(ELASTICSEARCH_PORT)%'

    App\Service\Search\ElasticsearchBulkStreamer:
      arguments:
        $esHost: 'http://%env(ELASTICSEARCH_HOST)%:%env(ELASTICSEARCH_PORT)%'

    App\Service\Logging\ElasticsearchLogger:
      arguments:
        $client: '@Elastica\Client'
        $indexPrefix: 'application-logs'

    # Service locator for TrainIpaPredictorModelCommand
    App\Service\LanguageDetection\LanguageTransliteration\Command\TrainIpaPredictorModelCommand:
        arguments:
            $container: !tagged_locator app.language_repository

    # Inject project directory for model file path resolution
    App\Service\LanguageDetection\LanguageTransliteration\LanguageTransliterationDetectionService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Redis cache service configuration
    App\Service\Cache\RedisCacheService:
        arguments:
            $redisDsn: '%env(LOCK_DSN)%'

    App\Service\Metrics\PrometheusMetricsService:
        arguments:
            $redisDsn: '%env(LOCK_DSN)%'

    App\EventSubscriber\ApiKeyAuthSubscriber:
        arguments:
            $apiKey: '%env(API_KEY)%'

    App\Service\Categorization\WordCategorizationService:
        arguments:
            $anthropicApiKey: '%env(ANTHROPIC_API_KEY)%'

    App\Service\Categorization\OpenAIWordCategorizationService:
        arguments:
            $openaiApiKey: '%env(OPENAI_API_KEY)%'

    App\Service\ManuscriptAlphabetDecodeSelectionService:
        arguments:
            $openaiApiKey: '%env(OPENAI_API_KEY)%'

    App\Service\Search\WordCategorySearchService:
        arguments:
            $esHost: 'http://%env(ELASTICSEARCH_HOST)%:%env(ELASTICSEARCH_PORT)%'