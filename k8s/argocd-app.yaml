apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lingwhaat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/akabihno/lingwhaat
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: lingwhaat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # ignoreDifferences below only affects diff computation; without this option
    # ArgoCD still applies storageClassName on the bound PVC, which the API
    # server rejects as immutable, failing the sync for every other manifest too.
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: elasticsearch-data
      jsonPointers:
        - /spec/storageClassName
